name: Build Room Server

on:
  push:
    branches: [master]
    paths:
      - 'room-go/**'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - go-version: '1.22'
            os: ubuntu-latest
            suffix: linux-amd64
          - go-version: '1.22'
            os: macos-latest
            suffix: darwin-amd64
          - go-version: '1.22'
            os: windows-latest
            suffix: windows-amd64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Build
        working-directory: room-go
        run: |
          go mod tidy
          go build -ldflags="-s -w" -o ../room-${{ matrix.suffix }} .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: room-${{ matrix.suffix }}
          path: room-${{ matrix.suffix }}
          if-no-files-found: error
