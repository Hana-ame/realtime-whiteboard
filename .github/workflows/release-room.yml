# room server 的构建与发布。
#
# 触发方式与产物：
#   tag v*           -> 正式发布，产物挂到对应 tag 的 GitHub Release
#   workflow_dispatch -> 手动指定版本号，同上
#   master 分支推送  -> 只跑测试并上传 artifact，不建 Release（dev 构建）
#   PR               -> 只跑测试
#
# 版本号来源：手动输入 > tag 名 > dev-<run_number>-<sha7>。
name: Release Room Server

on:
  push:
    tags:
      - 'v*'
    branches:
      - master
    paths:
      - 'room-go/**'
      - '.github/workflows/release-room.yml'
  pull_request:
    paths:
      - 'room-go/**'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号，不带 v 也可以，例如 v1.0.0'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

concurrency:
  group: room-release-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

# res_version 保留原始形态（tag 名与手动输入都可能带前导 v），去掉前导 v 的
# 归一化交给 build job 的 Resolve version 步骤在 bash 里做——这是唯一能同时正确
# 处理「带 v」与「不带 v」两种输入的方式。矩阵各实例写各自的 GITHUB_ENV 不构成竞争。
# 注意：这些键必须放在 env: 下面——GitHub 对 workflow 顶层做严格 schema 校验，
# 未知顶层键会让整份 workflow 解析失败（表现为 run 无任何 job 直接 failure）。
env:
  GO_VERSION: '1.22.x'
  res_version: ${{ github.event_name == 'workflow_dispatch' && inputs.version || startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('dev-{0}-{1}', github.run_number, github.sha_short) }}
  res_is_release: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}

jobs:
  build:
    name: build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.vars.outputs.version }}
      is_release: ${{ env.res_is_release }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: linux
            goarch: arm
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: room-go/go.sum

      - name: Resolve version
        id: vars
        shell: bash
        run: |
          set -euo pipefail
          # 去掉前导 v：tag 推送时 res_version 是 "v1.0.0"，手动输入可能是 "1.0.0"
          V="${res_version#v}"
          echo "version=$V" >> "$GITHUB_ENV"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "==> 版本 v$V（is_release=${res_is_release}，ref=${GITHUB_REF}）"

      - name: Tidy, vet, test
        working-directory: room-go
        run: |
          set -euo pipefail
          go mod tidy
          go vet ./...
          go test ./...

      - name: Build
        working-directory: room-go
        run: |
          set -euo pipefail
          exe=""
          [ "${{ matrix.goos }}" = "windows" ] && exe=".exe"
          GOOS="${{ matrix.goos }}" GOARCH="${{ matrix.goarch }}" CGO_ENABLED=0 \
            go build -trimpath -ldflags="-s -w -X main.version=v${version}" \
            -o "room_v${version}_${{ matrix.goos }}_${{ matrix.goarch }}${exe}" .
          ls -lh room_v*

      - name: Package
        run: |
          set -euo pipefail
          mkdir -p dist
          base="room_v${version}_${{ matrix.goos }}_${{ matrix.goarch }}"
          src="room-go/${base}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            src="${src}.exe"
            (cd room-go && zip -q "../dist/${base}.zip" "${base}.exe")
          else
            tar -czf "dist/${base}.tar.gz" -C room-go "$(basename "$src")"
          fi
          (cd dist && sha256sum "${base}".* > "SHA256SUMS.txt")
          ls -lh dist

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: room-server-v${{ steps.vars.outputs.version }}-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/room_v*
            dist/SHA256SUMS.txt
          if-no-files-found: ignore

  release:
    name: publish release
    needs: build
    if: needs.build.outputs.is_release == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: room-server-*
          merge-multiple: true

      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd dist
          find . -maxdepth 2 -type f \( -name 'room_v*' -o -name 'SHA256SUMS.txt' \) | sort
          assets=()
          while IFS= read -r f; do assets+=("$f"); done < <(find . -maxdepth 2 -type f \( -name 'room_v*' -o -name 'SHA256SUMS.txt' \) | sort)
          gh release create "v${{ needs.build.outputs.version }}" \
            --title "room-server v${{ needs.build.outputs.version }}" \
            --generate-notes \
            "${assets[@]}"
          echo "已发布 v${{ needs.build.outputs.version }}"
