name: Deploy to Cloudflare Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: cf-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Pages via API
        env:
          CF_EMAIL: ${{ secrets.CF_GLOBAL_EMAIL }}
          CF_KEY: ${{ secrets.CF_GLOBAL_KEY }}
          CF_ACCOUNT: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          python3 << 'PYEOF'
          import os, json, urllib.request, urllib.error, mimetypes, uuid

          cf_email = os.environ['CF_EMAIL']
          cf_key = os.environ['CF_KEY']
          cf_account = os.environ['CF_ACCOUNT']

          # Walk dist directory and collect files
          dist_dir = 'dist'
          files = []
          for root, dirs, fnames in os.walk(dist_dir):
              for fname in fnames:
                  full_path = os.path.join(root, fname)
                  rel_path = os.path.relpath(full_path, dist_dir)
                  files.append((rel_path, full_path))

          print(f"Found {len(files)} files")
          for rel, full in files:
              print(f"  {rel} ({os.path.getsize(full)} bytes)")

          # Build manifest
          manifest = {rel: {} for rel, _ in files}
          print(f"Manifest: {json.dumps(manifest)}")

          # Build multipart form data
          boundary = uuid.uuid4().hex
          body = b''

          # Add manifest field
          body += f'--{boundary}\r\n'.encode()
          body += b'Content-Type: application/json\r\n'
          body += b'Content-Disposition: form-data; name="manifest"\r\n\r\n'
          body += json.dumps(manifest).encode()
          body += b'\r\n'

          # Add files
          for rel_path, full_path in files:
              body += f'--{boundary}\r\n'.encode()
              ctype = mimetypes.guess_type(full_path)[0] or 'application/octet-stream'
              body += f'Content-Type: {ctype}\r\n'.encode()
              body += f'Content-Disposition: form-data; name="{rel_path}"; filename="{rel_path}"\r\n\r\n'.encode()
              with open(full_path, 'rb') as f:
                  body += f.read()
              body += b'\r\n'

          body += f'--{boundary}--\r\n'.encode()

          print(f"Total body size: {len(body)} bytes")

          # Make API request
          url = f'https://api.cloudflare.com/client/v4/accounts/{cf_account}/pages/projects/realtime-whiteboard/deployments'
          req = urllib.request.Request(url, data=body, method='POST')
          req.add_header('X-Auth-Email', cf_email)
          req.add_header('X-Auth-Key', cf_key)
          req.add_header('Content-Type', f'multipart/form-data; boundary={boundary}')

          try:
              with urllib.request.urlopen(req) as resp:
                  result = json.loads(resp.read().decode())
                  print(f"HTTP {resp.status}")
                  print(f"Response: {json.dumps(result, indent=2)}")
                  dep_id = result['result']['id']
                  print(f"Deployment ID: {dep_id}")
                  print(f"URL: https://{dep_id}.realtime-whiteboard-3w5.pages.dev")
          except urllib.error.HTTPError as e:
              print(f"HTTP Error: {e.code}")
              print(f"Response: {e.read().decode()}")
              exit(1)
          PYEOF
